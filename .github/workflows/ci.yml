# Same evidence as the local hooks: commit messages, documentation, the API contract, format, lint, architecture,
# theme roles, tests and a production build. Actions are pinned to a commit; the comment names its release.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            scripts/check-commit-msg.sh "$RUNNER_TEMP/msg" || { echo "in commit $sha"; exit 1; }
          done
      - name: Check documentation
        run: scripts/check-docs.sh
      - name: Check the API types match api/openapi.json
        run: |
          scripts/sync-api.sh
          git diff --exit-code -- src/app/shared/infrastructure/api/pibble.schema.ts
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Architecture
        run: pnpm arch
      - name: Theme roles
        run: pnpm theme:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
