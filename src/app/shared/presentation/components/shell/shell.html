<a class="skip-link" href="#main">{{ 'shared.nav.skip' | translate }}</a>

<aside class="drawer" [attr.aria-label]="'shared.nav.main' | translate">
  <span class="wordmark">{{ 'app.name' | translate }}</span>
  <ng-content select="[appShellEstablishment]" />
  <mat-nav-list>
    @for (item of navigation(); track item.path) {
      <a
        mat-list-item
        [routerLink]="item.path"
        [activated]="active() === item.path"
        [attr.aria-current]="active() === item.path ? 'page' : null"
      >
        <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label | translate }}</span>
      </a>
    }
  </mat-nav-list>
  <div class="drawer-end">
    <ng-content select="[appShellProfile]" />
  </div>
</aside>

<header class="top-bar">
  <ng-content select="[appShellTopBar]" />
</header>

<main id="main" tabindex="-1">
  <ng-content />
</main>

<nav class="bar" [attr.aria-label]="'shared.nav.main' | translate">
  @for (item of navigation(); track item.path) {
    <a
      class="tab"
      [routerLink]="item.path"
      [class.active]="active() === item.path"
      [attr.aria-current]="active() === item.path ? 'page' : null"
    >
      <span class="indicator"
        ><mat-icon aria-hidden="true">{{ item.icon }}</mat-icon></span
      >
      <span class="label">{{ item.label | translate }}</span>
    </a>
  }
</nav>
