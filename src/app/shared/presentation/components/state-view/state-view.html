<span class="icon"
  ><mat-icon aria-hidden="true">{{ icon() }}</mat-icon></span
>
<h2>{{ titleKey() | translate }}</h2>
<p>{{ messageKey() | translate }}</p>
@if (retryable()) {
  <button matButton="tonal" type="button" (click)="retry.emit()">
    <mat-icon aria-hidden="true">refresh</mat-icon>
    {{ 'shared.state.retry' | translate }}
  </button>
}
<ng-content />
